
name: Playwright API Tests

on:
  push:
    branches: [main]
    paths:
      - "api-playwright/**"
      - ".github/workflows/playwright-api.yml"

  workflow_dispatch:

  schedule:
    - cron: "0 0 1 * *" # Monthly: 1st day at 00:00 UTC (5:30 AM IST)

jobs:
  api-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-playwright

    env:
      TEST_ENV: qa
      QA_EMAIL: ${{ secrets.PLAYWRIGHT_QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.PLAYWRIGHT_QA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-playwright/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Playwright API Tests
        run: npx playwright test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-API-HTML-Report
          path: api-playwright/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-API-Test-Results
          path: api-playwright/test-results/
          retention-days: 30
          if-no-files-found: ignore
